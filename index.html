<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Rewards</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
header {
  padding: 20px;
  background: #1e293b;
  text-align: center;
}
h1 { color: #38bdf8; }
.container {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 18px;
}
button {
  background: #38bdf8;
  color: #0f172a;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  width: 100%;
}
button:disabled {
  opacity: 0.5;
}
.balance {
  font-size: 28px;
  color: #38bdf8;
  font-weight: bold;
}
footer {
  text-align: center;
  color: #94a3b8;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 Video Rewards</h1>
  <p>Watch videos. Collect points.</p>
</header>

<div class="container">

  <div class="card">
    <h2>Your Points</h2>
    <div class="balance" id="points">0</div>
    <p>Demo points</p>
  </div>

  <div class="card">
    <h2>Featured Video</h2>
    <p>Enjoy our featured video.</p>

    <iframe
      width="100%"
      height="220"
      src="https://www.youtube.com/embed/jfKfPfyJRdk"
      title="Featured video"
      frameborder="0"
      allowfullscreen>
    </iframe>

    <p>Demo reward: 10 points</p>

    <button id="rewardButton" onclick="earnPoints()">
      Collect Demo Points
    </button>
  </div>

  <div class="card">
    <h2>How it works</h2>
    <p>1. Watch videos.</p>
    <p>2. Collect demo points.</p>
    <p>3. Track your progress.</p>
  </div>

</div>

<footer>
  Demo website — points have no cash value.
</footer>

<script>
let points = 0;

function earnPoints() {
  points += 10;
  document.getElementById("points").innerText = points;

  const button = document.getElementById("rewardButton");
  button.innerText = "10 points collected!";
  button.disabled = true;
}
</script>

</body>
</html>
